name: Patch fast direct ntfy

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-fast-direct-ntfy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      CONST_B64: ""
      LOGIC_B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Add immediate ntfy delivery to seconds watcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,base64
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          const=base64.b64decode(os.environ['CONST_B64']).decode()
          logic=base64.b64decode(os.environ['LOGIC_B64']).decode()
          marker="const sha=process.env.GITHUB_SHA;\n"
          if 'const ntfyTopic=process.env.NTFY_TOPIC' not in s:
              if marker not in s: raise SystemExit('sha marker missing')
              s=s.replace(marker,marker+const,1)
          marker2="const prev=state.products[product.key]||null;const {next,transition}=applyObservation(prev,obs,product);state.products[product.key]=next;\n"
          if 'Direct ntfy path:' not in s:
              if marker2 not in s: raise SystemExit('transition marker missing')
              s=s.replace(marker2,marker2+logic,1)
          p.write_text(s)
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Send verified fast drops directly to ntfy"
          git push
