name: Patch fast Best Buy parser

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-fast-bestbuy-parser.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Port proven SKU-specific Best Buy parser
        shell: bash
        env:
          PARSER_B64: ""
          CHECK_B64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,base64
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          parser=base64.b64decode(os.environ['PARSER_B64']).decode()
          check=base64.b64decode(os.environ['CHECK_B64']).decode()
          a=s.index('function bestBuyContext(html,sku){')
          b=s.index('function bestBuyPrice(ctx){',a)
          s=s[:a]+parser+s[b:]
          a=s.index('async function checkBestBuy(product){')
          b=s.index('\n\nfunction scopeAround(html,sku){',a)
          s=s[:a]+check+s[b:]
          p.write_text(s)
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Use proven Best Buy SKU parser in fast watcher"
          git push
