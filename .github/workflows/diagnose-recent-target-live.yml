name: Diagnose recent Target live states

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-recent-target-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect recent Target actionable snapshots
        shell: bash
        run: |
          git fetch origin pokemon-fast-state:refs/remotes/origin/pokemon-fast-state
          python - <<'PY'
          import json, subprocess, datetime
          path='pokemon-drop-radar/fast-state.json'
          raw=subprocess.check_output(['git','log','origin/pokemon-fast-state','--format=%H|%cI','--',path],text=True)
          now=datetime.datetime.now(datetime.timezone.utc)
          rows=[]
          for line in raw.splitlines()[:120]:
              sha,dt=line.split('|',1)
              when=datetime.datetime.fromisoformat(dt.replace('Z','+00:00'))
              if (now-when).total_seconds()>3600: break
              try:
                  txt=subprocess.check_output(['git','show',f'{sha}:{path}'],text=True,stderr=subprocess.DEVNULL)
                  st=json.loads(txt)
              except Exception:
                  continue
              for key,p in st.get('products',{}).items():
                  if p.get('retailer')=='Target' and p.get('actionable') is True:
                      rows.append((dt,sha[:8],key,p.get('status'),p.get('price'),p.get('lastProbeAt'),p.get('ntfySentForLive')))
          print('TARGET_ACTIONABLE_SNAPSHOTS_LAST_HOUR')
          if not rows:
              print('NONE')
          else:
              for r in rows: print('|'.join(map(str,r)))
          PY
