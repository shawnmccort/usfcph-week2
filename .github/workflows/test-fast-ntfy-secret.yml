name: Test fast ntfy secret

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test-fast-ntfy-secret.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send clearly labeled ntfy test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC is missing"
            exit 42
          fi
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              "topic": os.environ["NTFY_TOPIC"],
              "title": "✅ Pokemon Drop Radar test",
              "message": "Direct seconds-level ntfy delivery is connected. This is only a test, not a stock alert.",
              "priority": 3,
              "tags": ["white_check_mark"]
          }).encode()
          req = urllib.request.Request("https://ntfy.sh", data=body, headers={"content-type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as r:
              if r.status < 200 or r.status >= 300:
                  raise SystemExit(f"ntfy HTTP {r.status}")
          print("ntfy test delivered")
          PY
