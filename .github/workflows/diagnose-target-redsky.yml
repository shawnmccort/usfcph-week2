name: Diagnose Target fulfillment signal

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-target-redsky.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Target read-only product JSON
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          key='9f36aeafbe60771e321a7cc95a78140772ab3e96'
          tcin='1010892068'
          base='https://redsky.target.com/redsky_aggregations/v1/web/pdp_client_v1'
          params={'key':key,'tcin':tcin,'store_id':'655','pricing_store_id':'655','zip':'33617','state':'FL','channel':'WEB'}
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  data=json.load(r)
              p=(data.get('data') or {}).get('product') or {}
              print('HTTP_OK')
              print('TOP_KEYS',sorted(p.keys()))
              for k in ['tcin','price','fulfillment','item','ratings_and_reviews']:
                  v=p.get(k)
                  if k=='item' and isinstance(v,dict):
                      print('ITEM_KEYS',sorted(v.keys()))
                  elif k=='price': print('PRICE',json.dumps(v,sort_keys=True)[:1200])
                  elif k=='fulfillment': print('FULFILLMENT',json.dumps(v,sort_keys=True)[:4000])
                  elif k=='tcin': print('TCIN',v)
          except Exception as e:
              print('ERROR',type(e).__name__,str(e))
              raise
          PY
