name: Deploy Pokemon Drop Radar

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokemon-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Write deployment report
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          CONFIG_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          mkdir -p pokemon-drop-radar
          printf '{\n  "checkedAt": "%s",\n  "deploymentOutcome": "%s",\n  "pageUrl": "%s"\n}\n' "$(date -u +%FT%TZ)" "$DEPLOY_OUTCOME" "$PAGE_URL" > pokemon-drop-radar/pages-status.json
          git config user.name "pokemon-dashboard[bot]"
          git config user.email "pokemon-dashboard[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/pages-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard deployment [skip ci]"
            git push origin HEAD:gh-pages
          fi
