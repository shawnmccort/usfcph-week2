name: Deploy Pokemon Drop Radar

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokemon-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Validate dashboard controls and JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('pokemon-drop-radar/live.html','utf8');
          const required = [
            'id="actionableOnly"',
            "$('#actionableOnly').onclick",
            'id="reload"',
            "$('#reload').onclick",
            'Reload latest state',
            'pdrActionableOnly'
          ];
          for (const value of required) {
            if (!html.includes(value)) throw new Error(`Missing required dashboard control: ${value}`);
          }
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if (!scripts.length) throw new Error('No dashboard JavaScript found');
          for (const script of scripts) new Function(script);
          console.log('Dashboard smoke test passed');
          NODE

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment report
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          CONFIG_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          mkdir -p pokemon-drop-radar
          printf '{\n  "checkedAt": "%s",\n  "deploymentOutcome": "%s",\n  "pageUrl": "%s"\n}\n' "$(date -u +%FT%TZ)" "$DEPLOY_OUTCOME" "$PAGE_URL" > pokemon-drop-radar/pages-status.json
          git config user.name "pokemon-dashboard[bot]"
          git config user.email "pokemon-dashboard[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/pages-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record dashboard deployment [skip ci]"
            git push origin HEAD:gh-pages
          fi
