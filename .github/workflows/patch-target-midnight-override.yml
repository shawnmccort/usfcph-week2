name: Patch Target midnight override

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-target-midnight-override.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      OLD_B64: "ZnVuY3Rpb24gcXVpZXROb3coKXsKICBjb25zdCBob3VyPU51bWJlcihuZXcgSW50bC5EYXRlVGltZUZvcm1hdCgnZW4tVVMnLHt0aW1lWm9uZTonQW1lcmljYS9OZXdfWW9yaycsaG91cjonMi1kaWdpdCcsaG91ckN5Y2xlOidoMjMnfSkuZm9ybWF0KG5ldyBEYXRlKCkpKTsKICByZXR1cm4gaG91cj49MCYmaG91cjw4Owp9Cg=="
      NEW_B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Enable Target alerts midnight to 3am Eastern tonight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old not in s:
              raise SystemExit('quietNow marker not found')
          s=s.replace(old,new,1)
          s=s.replace("if(!ntfyTopic||quietNow())return false;","if(!ntfyTopic||quietNow(product))return false;",1)
          s=s.replace("    priority:4,","    priority:targetTonightOverride(product)?5:4,",1)
          s=s.replace("      if(quietNow()){","      if(quietNow(product)){",1)
          p.write_text(s)
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Enable Target midnight drop alerts tonight"
          git push
