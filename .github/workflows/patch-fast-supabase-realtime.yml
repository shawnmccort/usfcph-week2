name: Patch fast Supabase realtime transport

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-fast-supabase-realtime.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      FN_B64: ""
      OLD_B64: "YXN5bmMgZnVuY3Rpb24gc2F2ZVN0YXRlKHN0YXRlKXsKICBzdGF0ZS51cGRhdGVkQXQ9bmV3IERhdGUoKS50b0lTT1N0cmluZygpOwogIGF3YWl0IHdyaXRlQnJhbmNoVGV4dChTVEFURV9CUkFOQ0gsU1RBVEVfUEFUSCxKU09OLnN0cmluZ2lmeShzdGF0ZSxudWxsLDIpKydcbicsJ1VwZGF0ZSBmYXN0IFBva2Vtb24gd2F0Y2hlciBzdGF0ZSBbc2tpcCBjaV0nKTsKfQo="
      NEW_B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Publish fast state to Supabase realtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          marker="const NTFY_SERVER=(process.env.NTFY_SERVER||'https://ntfy.sh').replace(/\\\/$/,'');\n"
          insert="const SUPABASE_URL='https://avtjrtqzwjiefpowboqo.supabase.co';\nconst SUPABASE_KEY='sb_publishable_yPWA8Ghh-UpxNGt-wSVkvw_3sOkdFTr';\n"
          if "const SUPABASE_URL=" not in s:
              if marker not in s: raise SystemExit('supabase constant marker missing')
              s=s.replace(marker,marker+insert,1)
          fn=base64.b64decode(os.environ['FN_B64']).decode()
          if 'async function publishRealtimeState' not in s:
              m="if(!token)throw new Error('GITHUB_TOKEN missing');\n"
              if m not in s: raise SystemExit('function marker missing')
              s=s.replace(m,fn+m,1)
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old in s:
              s=s.replace(old,new,1)
          elif 'await publishRealtimeState(state);' not in s:
              raise SystemExit('saveState marker missing')
          p.write_text(s)
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Publish fast state through Supabase realtime"
          git push
