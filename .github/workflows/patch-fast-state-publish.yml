name: Patch fast state publish cadence

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-fast-state-publish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish fast state every 30 seconds
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          old='const SAVE_MS=5*60_000;'
          new='const SAVE_MS=30_000;'
          if old not in s:
              raise SystemExit('SAVE_MS marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Publish fast state every 30 seconds"
          git push
