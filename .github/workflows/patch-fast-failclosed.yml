name: Patch fast watcher fail-closed status

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-fast-failclosed.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make non-actionable live-looking statuses fail closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pokemon-drop-radar/fast-watch.mjs')
          s = p.read_text()
          marker = "function applyObservation(prev,obs,product){\n  const now=new Date().toISOString();"
          replacement = marker + "\n  // Never publish an actionable-looking status unless every verifier gate passed.\n  const safeStatus=obs.actionable===true||!ACTIONABLE.has(obs.status)?obs.status:'unknown';"
          if marker not in s:
              raise SystemExit('applyObservation marker missing')
          s = s.replace(marker, replacement, 1)
          if s.count('status:obs.status') != 3:
              raise SystemExit(f'unexpected status replacement count: {s.count("status:obs.status")}')
          s = s.replace('status:obs.status', 'status:safeStatus')
          if s.count('prev.clearCandidateStatus===obs.status') != 1:
              raise SystemExit('clear comparison marker missing')
          s = s.replace('prev.clearCandidateStatus===obs.status', 'prev.clearCandidateStatus===safeStatus', 1)
          if s.count('clearCandidateStatus:obs.status') != 1:
              raise SystemExit('clear candidate marker missing')
          s = s.replace('clearCandidateStatus:obs.status', 'clearCandidateStatus:safeStatus', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Fail closed on unverified fast availability"
          git push
