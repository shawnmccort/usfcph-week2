name: Patch Target evidence confirmation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/patch-target-evidence-confirmation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      OLD_B64: ""
      NEW_B64: ""
    steps:
      - uses: actions/checkout@v4
      - name: Apply Target evidence confirmation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,base64
          p=Path('pokemon-drop-radar/fast-watch.mjs')
          s=p.read_text()
          if "node:crypto" not in s:
              s=s.replace("import fs from 'node:fs/promises';\n", "import fs from 'node:fs/promises';\nimport {createHash} from 'node:crypto';\n",1)
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old in s:
              s=s.replace(old,new,1)
          elif 'checkTargetConfirmed' not in s:
              raise SystemExit('Target checker marker not found')
          s=s.replace("const base={...prev,health:'ok',lastProbeAt:now,lastVerifiedAt:now,lastError:null,http:obs.http??null};","const base={...prev,health:'ok',lastProbeAt:now,lastVerifiedAt:now,lastError:null,http:obs.http??null,lastEvidenceVerdict:obs.evidenceVerdict||null,lastEvidenceProbes:obs.evidenceProbes||null};",1)
          s=s.replace("return{next:{name:product.name,retailer:product.retailer,url:product.url,maxPrice:product.maxPrice,status:safeStatus,price:obs.price??null,actionable:obs.actionable===true,health:'ok',lastProbeAt:now,lastVerifiedAt:now,lastError:null,http:obs.http??null,clearCandidateCount:0},transition:null};","return{next:{name:product.name,retailer:product.retailer,url:product.url,maxPrice:product.maxPrice,status:safeStatus,price:obs.price??null,actionable:obs.actionable===true,health:'ok',lastProbeAt:now,lastVerifiedAt:now,lastError:null,http:obs.http??null,clearCandidateCount:0,lastEvidenceVerdict:obs.evidenceVerdict||null,lastEvidenceProbes:obs.evidenceProbes||null},transition:null};",1)
          s=s.replace("return{next:{...base,status:safeStatus,price:obs.price??null,actionable:false,clearCandidateStatus:null,clearCandidatePrice:null,clearCandidateCount:0},transition:'cleared'};","return{next:{...base,status:safeStatus,price:obs.price??null,actionable:false,clearCandidateStatus:null,clearCandidatePrice:null,clearCandidateCount:0,lastClearEvidence:{at:now,verdict:obs.evidenceVerdict||null,probes:obs.evidenceProbes||null}},transition:'cleared'};",1)
          s=s.replace("const became=prev.actionable!==true&&obs.actionable===true;\n  return{next:{...base,status:safeStatus,price:obs.price??null,actionable:obs.actionable===true,clearCandidateStatus:null,clearCandidatePrice:null,clearCandidateCount:0},transition:became?'new':null};","const became=prev.actionable!==true&&obs.actionable===true;\n  return{next:{...base,status:safeStatus,price:obs.price??null,actionable:obs.actionable===true,clearCandidateStatus:null,clearCandidatePrice:null,clearCandidateCount:0,...(became?{lastLiveEvidence:{at:now,verdict:obs.evidenceVerdict||null,probes:obs.evidenceProbes||null}}:{})},transition:became?'new':null};",1)
          needle="      'Verified by the seconds-level Pokemon Drop Radar'\n"
          if needle in s and "CONFIRMED 2/2 independent reads" not in s:
              s=s.replace(needle,"      row.lastEvidenceVerdict==='confirmed_2_of_2'?'CONFIRMED 2/2 independent reads':'Verified by the seconds-level Pokemon Drop Radar',\n      'Verified by the seconds-level Pokemon Drop Radar'\n",1)
          p.write_text(s)
          PY
          node --check pokemon-drop-radar/fast-watch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-drop-radar/fast-watch.mjs
          git commit -m "Require 2-of-2 Target confirmation and retain evidence"
          git push
