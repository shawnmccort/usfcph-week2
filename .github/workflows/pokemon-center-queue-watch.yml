name: Pokemon Center TCG Queue Watch

on:
  schedule:
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pokemon-drop-radar/queue-watch.mjs"
      - ".github/workflows/pokemon-center-queue-watch.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  queue-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: pokemon-center-continuous-queue-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply queue notification quiet hours once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pokemon-drop-radar/queue-watch.mjs')
          s=p.read_text()
          if 'function quietNow()' not in s:
              s=s.replace('const REMIND_MS=15*60_000;','const REMIND_MS=30*60_000;',1)
              marker="const sleep=ms=>new Promise(r=>setTimeout(r,ms));\n"
              insert="const sleep=ms=>new Promise(r=>setTimeout(r,ms));\nfunction quietNow(){\n  const hour=Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',hourCycle:'h23'}).format(new Date()));\n  return hour>=23||hour<8;\n}\n"
              if marker not in s: raise SystemExit('sleep marker missing')
              s=s.replace(marker,insert,1)
              old="""    if(found.active){
      const reminder=lastAlertAt&&Date.now()-lastAlertAt>=REMIND_MS;
      if(!alertPr){
        const pushed=await pushQueue(found,false);
        console.log('QUEUE ACTIVE — ntfy',pushed?'sent':'topic unavailable/send failed');
        try{alertPr=await createAlertPr(found);console.log('GitHub-native backup PR created',alertPr.number)}catch(e){console.log('GitHub-native backup PR unavailable',String(e?.message||e))}
        lastAlertAt=Date.now();
      }else if(reminder){
        const pushed=await pushQueue(found,true);
        await remindAlertPr(alertPr,found);
        console.log('QUEUE ACTIVE reminder — ntfy',pushed?'sent':'topic unavailable/send failed');
        lastAlertAt=Date.now();
      }
"""
              new="""    if(found.active){
      const quiet=quietNow();
      const reminder=lastAlertAt&&Date.now()-lastAlertAt>=REMIND_MS;
      if(!alertPr){
        if(quiet){
          console.log('QUEUE ACTIVE — alert deferred during 23:00-08:00 America/New_York quiet hours');
        }else{
          const pushed=await pushQueue(found,false);
          console.log('QUEUE ACTIVE — ntfy',pushed?'sent':'topic unavailable/send failed');
          try{alertPr=await createAlertPr(found);console.log('GitHub-native backup PR created',alertPr.number)}catch(e){console.log('GitHub-native backup PR unavailable',String(e?.message||e))}
          lastAlertAt=Date.now();
        }
      }else if(reminder&&!quiet){
        const pushed=await pushQueue(found,true);
        await remindAlertPr(alertPr,found);
        console.log('QUEUE ACTIVE reminder — ntfy',pushed?'sent':'topic unavailable/send failed');
        lastAlertAt=Date.now();
      }
"""
              if old not in s: raise SystemExit('alert block missing')
              p.write_text(s.replace(old,new,1))
          PY
          if ! git diff --quiet -- pokemon-drop-radar/queue-watch.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pokemon-drop-radar/queue-watch.mjs
            git commit -m "Respect overnight quiet hours for queue alerts"
            git push
          else
            echo "Queue quiet-hours patch already present"
          fi

      - name: Remove one-time notification test branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/pokemon-queue-notification-test-32766873124" >/dev/null || true

      - name: Preflight Pokemon Center TCG queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          QUEUE_WATCH_ONCE: "1"
        run: node pokemon-drop-radar/queue-watch.mjs

      - name: Watch Pokemon Center TCG queue every 10 seconds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pokemon-drop-radar/queue-watch.mjs

# final queue guard deployed 2026-08-24
