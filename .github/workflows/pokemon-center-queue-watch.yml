name: Pokemon Center TCG Queue Watch

on:
  schedule:
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pokemon-drop-radar/queue-watch.mjs"
      - ".github/workflows/pokemon-center-queue-watch.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  queue-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: pokemon-center-continuous-queue-watch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove one-time notification test branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/pokemon-queue-notification-test-32766873124" >/dev/null || true

      - name: Preflight Pokemon Center TCG queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          QUEUE_WATCH_ONCE: "1"
        run: node pokemon-drop-radar/queue-watch.mjs

      - name: Watch Pokemon Center TCG queue every 10 seconds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pokemon-drop-radar/queue-watch.mjs
