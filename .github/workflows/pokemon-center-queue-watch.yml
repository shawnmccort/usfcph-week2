name: Pokemon Center TCG Queue Watch

on:
  schedule:
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pokemon-drop-radar/queue-watch.mjs"
      - ".github/workflows/pokemon-center-queue-watch.yml"

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  queue-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: pokemon-center-continuous-queue-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight Pokemon Center TCG queue probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          QUEUE_WATCH_ONCE: "1"
        run: node pokemon-drop-radar/queue-watch.mjs

      - name: Mark continuous queue watcher online
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"pokemon-center-queue-watch","description":"Continuous 60-second TCG queue watcher online"}' >/dev/null

      - name: Watch Pokemon Center TCG queue every minute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pokemon-drop-radar/queue-watch.mjs
